<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Storm Garden Simulator</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: sans-serif;
  background: #0b1420;
  transition: background 2s ease;
}

/* 🌧️ rain */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* ⚡ flash */
#flash {
  position: fixed;
  width: 100%;
  height: 100%;
  background: white;
  opacity: 0;
  z-index: 2;
  pointer-events: none;
}

/* 🪟 window */
.window {
  position: absolute;
  width: 92%;
  height: 85%;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);

  background: rgba(255,255,255,0.06);
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,0.2);
  backdrop-filter: blur(20px);
  box-shadow: 0 0 80px rgba(0,0,0,0.7);
}

/* 🌿 garden */
#garden {
  position: absolute;
  bottom: 110px;
  width: 100%;
  height: 70%;
}

/* 🌱 plant (real styled) */
.plant {
  width: 70px;
  height: 130px;
  position: absolute;
  cursor: pointer;
  transform-origin: bottom center;
  animation: sway 4s ease-in-out infinite;
}

@keyframes sway {
  0% { transform: rotate(-1deg); }
  50% { transform: rotate(2deg); }
  100% { transform: rotate(-1deg); }
}

/* stem */
.stem {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 6px;
  height: 100%;
  transform: translateX(-50%);
  background: linear-gradient(to top, #1b4d2d, #4cff9a);
  border-radius: 50px;
}

/* leaf */
.leaf {
  position: absolute;
  width: 26px;
  height: 14px;
  background: radial-gradient(circle at 30% 30%, #a8ffd0, #1f8f55);
  border-radius: 100% 0 100% 0;
}

/* glow mutation */
.glow {
  filter: drop-shadow(0 0 12px rgba(0,255,200,0.8));
}

/* 🧊 UI */
.ui {
  position: absolute;
  top: 15px;
  left: 15px;
  padding: 14px;
  border-radius: 16px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(14px);
  color: white;
}

button {
  margin-top: 6px;
  padding: 6px 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: rgba(255,255,255,0.25);
}

/* 🎮 tutorial */
#tutorial {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  color: white;
  text-align: center;
}
</style>
</head>

<body>

<canvas id="rain"></canvas>
<div id="flash"></div>

<!-- 🎮 tutorial -->
<div id="tutorial">
  <div style="background:rgba(255,255,255,0.1); padding:20px; border-radius:15px; backdrop-filter:blur(10px);">
    <h2>🌿 Storm Garden</h2>
    <p>Click “Plant Seed” to start</p>
    <p>Click plants to grow them</p>
    <p>Earn score → buy seeds</p>
    <button onclick="startGame()">Start</button>
  </div>
</div>

<div class="window">

<div class="ui">
⭐ Score: <span id="score">5</span><br>
🌱 Seeds: <span id="seeds">1</span><br>

<button onclick="buySeed()">Buy Seed</button>
<button onclick="plant()">Plant Seed</button>
<button onclick="waterAll()">Water</button>
</div>

<div id="garden"></div>

</div>

<script>

/* 🌧️ RAIN */
const c=document.getElementById("rain");
const x=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

let rain=Array.from({length:240},()=>({
x:Math.random()*c.width,
y:Math.random()*c.height,
l:10+Math.random()*15,
s:4+Math.random()*6
}));

function draw(){
x.clearRect(0,0,c.width,c.height);
x.strokeStyle="rgba(180,200,255,0.5)";
rain.forEach(r=>{
x.beginPath();
x.moveTo(r.x,r.y);
x.lineTo(r.x,r.y+r.l);
x.stroke();
r.y+=r.s;
if(r.y>c.height){r.y=-20;r.x=Math.random()*c.width;}
});
requestAnimationFrame(draw);
}
draw();

/* ⚡ lightning */
setInterval(()=>{
if(Math.random()>0.8){
let f=document.getElementById("flash");
f.style.opacity=1;
setTimeout(()=>f.style.opacity=0,120);
}
},2200);

/* 🌿 GAME */
let score=5;
let seeds=1;
let started=false;

function update(){
document.getElementById("score").innerText=score;
document.getElementById("seeds").innerText=seeds;
localStorage.setItem("score",score);
localStorage.setItem("seeds",seeds);
}

/* 🎮 start game */
function startGame(){
document.getElementById("tutorial").remove();
started=true;
update();
}

/* 💰 buy seed */
function buySeed(){
if(score>=3){
score-=3;
seeds++;
update();
}
}

/* 🌱 plant */
function plant(){
if(!started) return;
if(seeds<=0) return;

seeds--;

const p=document.createElement("div");
p.className="plant";

const stem=document.createElement("div");
stem.className="stem";
p.appendChild(stem);

let g=0;
let mutated=Math.random()>0.85;
if(mutated) p.classList.add("glow");

p.onclick=()=>{
g++;
score++;

const leaf=document.createElement("div");
leaf.className="leaf";
leaf.style.left=(Math.random()*40-20)+"px";
leaf.style.bottom=(g*18)+"px";
leaf.style.transform="rotate("+(Math.random()*80-40)+"deg)";

p.appendChild(leaf);

if(g>=7){
score+=10;
p.remove();
}

update();
};

document.getElementById("garden").appendChild(p);
update();
}

/* 💧 water */
function waterAll(){
document.querySelectorAll(".plant").forEach(p=>{
score++;
p.style.transform="scale(1.15)";
setTimeout(()=>p.style.transform="scale(1)",150);
});
update();
}

/* 🌙 ambience */
setInterval(()=>{
document.body.style.background=
new Date().getSeconds()%20<10 ? "#0b1420" : "#1b2a3a";
},2000);

/* load save */
score = Number(localStorage.getItem("score")) || 5;
seeds = Number(localStorage.getItem("seeds")) || 1;

update();

</script>

</body>
</html>
