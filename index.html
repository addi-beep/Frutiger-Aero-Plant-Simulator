<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aqua Aero Evolution Engine v3</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:sans-serif;
background:#061524;
color:white;
}

/* 🌊 water shader illusion */
#water{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at 50% 50%, rgba(0,255,255,0.08), transparent 60%),
radial-gradient(circle at 30% 30%, rgba(0,120,255,0.05), transparent 50%);
animation:flow 6s infinite alternate ease-in-out;
pointer-events:none;
}

@keyframes flow{
0%{transform:scale(1)}
100%{transform:scale(1.05)}
}

/* 🪟 tank */
.tank{
position:absolute;
width:92%;
height:85%;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(255,255,255,0.06);
backdrop-filter:blur(18px);
border-radius:30px;
overflow:hidden;
border:1px solid rgba(255,255,255,0.2);
}

/* 🐠 fish */
.fish{
position:absolute;
width:45px;
height:22px;
border-radius:50px;
cursor:pointer;
transition:transform 0.2s;
}

/* 🪸 coral (evolving) */
.coral{
position:absolute;
bottom:0;
width:10px;
background:linear-gradient(to top,#ff4da6,#ffccff);
border-radius:20px;
}

/* 🐙 boss */
.boss{
position:absolute;
width:120px;
height:60px;
border-radius:50px;
background:linear-gradient(to right,#4400ff,#00ffff);
opacity:0.9;
}

/* UI */
.ui{
position:absolute;
top:15px;
left:15px;
padding:12px;
background:rgba(255,255,255,0.12);
border-radius:14px;
backdrop-filter:blur(10px);
}

button{
margin:3px;
padding:6px 10px;
border-radius:10px;
border:none;
cursor:pointer;
background:rgba(255,255,255,0.25);
}

/* 🧬 breeding zone */
#breeder{
position:absolute;
bottom:20px;
left:20px;
padding:10px;
background:rgba(255,255,255,0.1);
border-radius:12px;
}
</style>
</head>

<body>

<div id="water"></div>

<div class="tank" id="tank"></div>

<div class="ui">
💰 Coins: <span id="coins">100</span><br>

<button onclick="spawnFish()">Buy Fish</button>
<button onclick="spawnBoss()">Spawn Boss</button>
<button onclick="expandTank()">Expand Tank</button>
</div>

<!-- 🧬 breeding UI -->
<div id="breeder">
🧬 Breeding Zone<br>
Drop 2 fish here
</div>

<script>

/* ======================
💰 CORE
====================== */
let coins=100;
let fishList=[];
let selected=[];

/* ======================
🎵 AMBIENT SOUND (procedural)
====================== */
function ambient(){
try{
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const o=ctx.createOscillator();
const g=ctx.createGain();

o.type="sine";
o.frequency.value=40;

g.gain.value=0.03;

o.connect(g);
g.connect(ctx.destination);

o.start();
}catch(e){}
}
ambient();

/* ======================
🐠 DNA SYSTEM
====================== */
function dna(parent=null){
return{
speed:parent?parent.speed+Math.random():1,
color:parent?parent.color:randomColor(),
aggression:Math.random()
};
}

function randomColor(){
let c=["#ff4d6d","#4dffea","#ffd24d","#a64dff","#4dff6a"];
return c[Math.floor(Math.random()*c.length)];
}

/* ======================
🐠 FISH AI
====================== */
function spawnFish(parent){

if(coins<10) return;
coins-=10;

let d=dna(parent);

const f=document.createElement("div");
f.className="fish";
f.style.background=d.color;

let x=Math.random()*600;
let y=100+Math.random()*300;

f.style.left=x+"px";
f.style.top=y+"px";

/* click = select for breeding */
f.onclick=()=>{
selected.push(d);
if(selected.length===2){
breed(selected[0],selected[1]);
selected=[];
}
};

/* AI movement */
setInterval(()=>{
x+=Math.sin(Date.now()*0.001)*d.speed;
y+=Math.cos(Date.now()*0.002)*2;

f.style.left=x+"px";
f.style.top=y+"px";
},50);

/* income */
setInterval(()=>{
coins+=1;
update();
},3000);

document.getElementById("tank").appendChild(f);
fishList.push(d);

update();
}

/* ======================
🧬 BREEDING SYSTEM
====================== */
function breed(a,b){

let child={
speed:(a.speed+b.speed)/2 + Math.random(),
color:Math.random()>0.5?a.color:b.color,
aggression:Math.random()
};

alert("🧬 New fish born!");

spawnFish(child);
}

/* ======================
🐙 BOSS SYSTEM
====================== */
function spawnBoss(){

const b=document.createElement("div");
b.className="boss";

let x=-150;

setInterval(()=>{
x+=2;
b.style.left=x+"px";
},30);

document.getElementById("tank").appendChild(b);
}

/* ======================
🪸 EVOLVING CORAL
====================== */
setInterval(()=>{
const c=document.createElement("div");
c.className="coral";

c.style.height=(30+Math.random()*100)+"px";
c.style.left=Math.random()*800+"px";

document.getElementById("tank").appendChild(c);
},5000);

/* ======================
📱 MOBILE DRAG SUPPORT
====================== */
let dragging=null;

document.addEventListener("touchstart",e=>{
dragging=e.target;
});

document.addEventListener("touchmove",e=>{
if(!dragging) return;
let t=e.touches[0];
dragging.style.left=t.clientX+"px";
dragging.style.top=t.clientY+"px";
});

/* ======================
🏆 PROGRESSION TREE
====================== */
function expandTank(){
if(coins<50) return;
coins-=50;

alert("🏆 Tank Expanded!");
}

/* ======================
📊 UPDATE
====================== */
function update(){
document.getElementById("coins").innerText=coins;
}

update();

</script>

</body>
</html>
