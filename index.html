<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Aqua 3D World</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<script>

/* ======================
🌊 SCENE SETUP
====================== */
let scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x03121f, 0.03);

let camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.set(0, 10, 30);

/* ======================
🌊 LIGHT
====================== */
let light = new THREE.DirectionalLight(0x88ccff, 1);
light.position.set(10, 20, 10);
scene.add(light);

/* ======================
🌊 FLOOR
====================== */
let floor = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0x062033 })
);

floor.rotation.x = -Math.PI / 2;
scene.add(floor);

/* ======================
🧭 CONTROLS
====================== */
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

/* ======================
🐠 FISH
====================== */
let fishGroup = [];

function createFish(){

let fish = new THREE.Group();

let body = new THREE.Mesh(
  new THREE.SphereGeometry(0.8, 12, 12),
  new THREE.MeshStandardMaterial({
    color: Math.random() * 0xffffff
  })
);

fish.add(body);

fish.position.set(
(Math.random() - 0.5) * 100,
Math.random() * 10,
(Math.random() - 0.5) * 100
);

scene.add(fish);
fishGroup.push(fish);
}

for(let i=0;i<40;i++) createFish();

/* ======================
🐋 WHALES
====================== */
let whales = [];

function spawnWhale(){

let whale = new THREE.Mesh(
new THREE.CapsuleGeometry(3, 10, 4, 8),
new THREE.MeshStandardMaterial({ color: 0x335577 })
);

whale.position.set(
(Math.random()-0.5)*150,
10,
(Math.random()-0.5)*150
);

scene.add(whale);
whales.push(whale);
}

for(let i=0;i<3;i++) spawnWhale();

/* ======================
🪸 CORAL
====================== */
function spawnCoral(){

let coral = new THREE.Mesh(
new THREE.ConeGeometry(1, Math.random()*5+2, 6),
new THREE.MeshStandardMaterial({
color: new THREE.Color(`hsl(${Math.random()*360},70%,60%)`)
})
);

coral.position.set(
(Math.random()-0.5)*200,
0,
(Math.random()-0.5)*200
);

scene.add(coral);
}

for(let i=0;i<60;i++) spawnCoral();

/* ======================
🌊 LOOP
====================== */
function animate(){

requestAnimationFrame(animate);

/* movement */
if(keys["w"]) camera.position.z -= 0.5;
if(keys["s"]) camera.position.z += 0.5;
if(keys["a"]) camera.position.x -= 0.5;
if(keys["d"]) camera.position.x += 0.5;

/* fish AI */
fishGroup.forEach(f => {
f.position.x += Math.sin(Date.now()*0.001)*0.1;
f.position.z += Math.cos(Date.now()*0.001)*0.1;
});

/* whales */
whales.forEach(w => {
w.position.x += Math.sin(Date.now()*0.0003)*0.05;
});

renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
