<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aqua Life (Visual Fix)</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
body { margin:0; overflow:hidden; background:#000b14; }
#ui {
position:absolute;
top:10px;
left:10px;
color:white;
padding:10px;
background:rgba(0,0,0,0.5);
border-radius:10px;
font-family:sans-serif;
}
</style>
</head>

<body>
<div id="ui">🌊 Loading...</div>

<script>

/* ======================
🌊 SCENE
====================== */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x061a2a, 0.03);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(
75, window.innerWidth/window.innerHeight, 0.1, 1000
);

camera.position.set(0,6,20);

/* ======================
💡 LIGHTING (fix visibility)
====================== */
const mainLight = new THREE.PointLight(0x66ccff, 2, 150);
mainLight.position.set(0,15,10);
scene.add(mainLight);

scene.add(new THREE.AmbientLight(0x223344, 1));

/* ======================
🌊 FLOOR
====================== */
const floor = new THREE.Mesh(
new THREE.PlaneGeometry(200,200),
new THREE.MeshStandardMaterial({ color:0x062433 })
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ======================
💰 COINS
====================== */
let coins = 0;

/* ======================
🧭 CONTROLS
====================== */
const keys = {};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

/* ======================
🐠 REALISTIC FISH (FIXED SHAPE DESIGN)
====================== */
const fish = [];

function spawnFish(){

const group = new THREE.Group();

/* BODY (oval fish silhouette) */
const body = new THREE.Mesh(
new THREE.BoxGeometry(1.8, 0.6, 1),
new THREE.MeshStandardMaterial({
color: new THREE.Color(`hsl(${Math.random()*360},70%,60%)`),
roughness: 0.4,
metalness: 0.1
})
);

/* TAIL (flat triangle shape) */
const tail = new THREE.Mesh(
new THREE.BoxGeometry(0.4, 0.8, 0.2),
new THREE.MeshStandardMaterial({ color:0xffffff })
);

tail.position.z = -1.1;

/* TOP FIN */
const topFin = new THREE.Mesh(
new THREE.BoxGeometry(0.2,0.5,0.6),
new THREE.MeshStandardMaterial({ color:0x88ccff })
);

topFin.position.y = 0.6;

/* SIDE FIN */
const sideFin = new THREE.Mesh(
new THREE.BoxGeometry(0.2,0.3,0.6),
new THREE.MeshStandardMaterial({ color:0x66aaff })
);

sideFin.position.x = 0.8;

group.add(body);
group.add(tail);
group.add(topFin);
group.add(sideFin);

/* position */
group.position.set(
(Math.random()-0.5)*70,
Math.random()*8,
(Math.random()-0.5)*70
);

scene.add(group);
fish.push(group);
}

for(let i=0;i<25;i++) spawnFish();

/* ======================
🌿 SEAWEED
====================== */
function spawnPlant(){

const plant = new THREE.Mesh(
new THREE.CylinderGeometry(0.2,0.3,3),
new THREE.MeshStandardMaterial({ color:0x00aa88 })
);

plant.position.set(
(Math.random()-0.5)*100,
-2,
(Math.random()-0.5)*100
);

scene.add(plant);
}

for(let i=0;i<60;i++) spawnPlant();

/* ======================
🐋 WHALES (simple but large silhouette)
====================== */
const whales = [];

function spawnWhale(){

const w = new THREE.Mesh(
new THREE.BoxGeometry(4,2,10),
new THREE.MeshStandardMaterial({ color:0x335577 })
);

w.position.set(
(Math.random()-0.5)*100,
6,
(Math.random()-0.5)*100
);

scene.add(w);
whales.push(w);
}

for(let i=0;i<2;i++) spawnWhale();

/* ======================
🌊 LOOP
====================== */
function animate(){

requestAnimationFrame(animate);

/* movement */
if(keys["w"]) camera.position.z -= 0.4;
if(keys["s"]) camera.position.z += 0.4;
if(keys["a"]) camera.position.x -= 0.4;
if(keys["d"]) camera.position.x += 0.4;

/* fish swimming (smooth curve motion) */
fish.forEach(f=>{
f.position.x += Math.sin(Date.now()*0.001 + f.position.z)*0.05;
f.position.z += Math.cos(Date.now()*0.001 + f.position.x)*0.05;
f.rotation.y += 0.01;
});

/* whales drift */
whales.forEach(w=>{
w.position.x += Math.sin(Date.now()*0.0003)*0.03;
});

/* camera underwater sway */
camera.position.y = 6 + Math.sin(Date.now()*0.0003)*0.5;

/* render */
renderer.render(scene,camera);

/* UI */
document.getElementById("ui").innerHTML =
`💰 Coins: ${coins} | 🐠 Fish: ${fish.length}`;

}

animate();

/* resize */
window.addEventListener("resize",()=>{
camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
