<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Storm Garden: Evolution</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: sans-serif;
  background: #0b1420;
  transition: background 2s;
}

/* 🌧️ canvas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
}

/* ⚡ flash */
#flash {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
}

/* 🪟 window */
.window {
  position: absolute;
  width: 92%;
  height: 85%;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: rgba(255,255,255,0.06);
  border-radius: 30px;
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.2);
}

/* 🌱 grid pots */
#garden {
  position: absolute;
  bottom: 110px;
  width: 100%;
  height: 70%;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
  padding: 20px;
}

/* 🪴 pot */
.pot {
  width: 70px;
  height: 90px;
  border-radius: 12px;
  background: rgba(120,80,50,0.4);
  position: relative;
  cursor: pointer;
}

/* 🌿 plant */
.plant {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  height: 40px;
  background: linear-gradient(to top, #1f5d37, #4cff9a);
  border-radius: 10px;
}

/* leaf */
.leaf {
  position: absolute;
  width: 18px;
  height: 10px;
  background: #4cff9a;
  border-radius: 50%;
}

/* ghost preview */
.ghost {
  position: fixed;
  width: 70px;
  height: 90px;
  background: rgba(255,255,255,0.15);
  border: 1px dashed rgba(255,255,255,0.5);
  pointer-events: none;
  border-radius: 12px;
}

/* UI */
.ui {
  position: absolute;
  top: 15px;
  left: 15px;
  padding: 12px;
  background: rgba(255,255,255,0.12);
  color: white;
  border-radius: 14px;
  backdrop-filter: blur(12px);
}

button {
  margin-top: 5px;
}
</style>
</head>

<body>

<canvas id="rain"></canvas>
<div id="flash"></div>

<div class="window">

<div class="ui">
⭐ Score: <span id="score">0</span><br>
🌱 Seeds: <span id="seeds">3</span><br>

<button onclick="startBreeding()">Breed Mode</button>
</div>

<div id="garden"></div>

</div>

<script>

/* ======================
🌧️ RAIN + SPEED EFFECT
====================== */
const c=document.getElementById("rain");
const x=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

let rainSpeed = 1;

let rain=Array.from({length:200},()=>({
x:Math.random()*c.width,
y:Math.random()*c.height,
l:10+Math.random()*15,
s:3+Math.random()*5
}));

function draw(){
x.clearRect(0,0,c.width,c.height);
x.strokeStyle="rgba(180,200,255,0.5)";
rain.forEach(r=>{
x.beginPath();
x.moveTo(r.x,r.y);
x.lineTo(r.x,r.y+r.l);
x.stroke();
r.y+=r.s*rainSpeed;
if(r.y>c.height){r.y=-20;r.x=Math.random()*c.width;}
});
requestAnimationFrame(draw);
}
draw();

/* ⚡ thunder sound (synthetic) */
function thunder(){
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const o=ctx.createOscillator();
const g=ctx.createGain();

o.type="square";
o.frequency.value=60;

g.gain.setValueAtTime(0.3,ctx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);

o.connect(g);
g.connect(ctx.destination);

o.start();
o.stop(ctx.currentTime+0.5);
}

setInterval(()=>{
if(Math.random()>0.8){
document.getElementById("flash").style.opacity=1;
setTimeout(()=>document.getElementById("flash").style.opacity=0,100);
thunder();
}
},2500);

/* ======================
🌿 GAME CORE
====================== */
let score=0;
let seeds=3;
let selectedPot=null;
let breeding=false;

const garden=document.getElementById("garden");

/* 🪴 create pots */
let pots=[];
for(let i=0;i<18;i++){
const p=document.createElement("div");
p.className="pot";

p.onclick=()=>placePlant(p);

garden.appendChild(p);
pots.push(p);
}

/* 🌱 ghost preview */
const ghost=document.createElement("div");
ghost.className="ghost";
document.body.appendChild(ghost);

document.addEventListener("mousemove",(e)=>{
ghost.style.left=e.clientX-35+"px";
ghost.style.top=e.clientY-45+"px";
});

/* 🌿 plant placement */
function placePlant(pot){
if(seeds<=0) return;
if(pot.querySelector(".plant")) return;

seeds--;

const plant=document.createElement("div");
plant.className="plant";

let growth=0;
let parentTrait=Math.random();

plant.onclick=(e)=>{
e.stopPropagation();
growth++;
score++;

let leaf=document.createElement("div");
leaf.className="leaf";
leaf.style.bottom=(growth*6)+"px";
leaf.style.left=(Math.random()*20-10)+"px";

plant.appendChild(leaf);

if(growth>=8){
score+=10;
plant.dataset.mature="true";
}

update();
};

pot.appendChild(plant);
update();
}

/* 🌧️ rain speeds growth */
setInterval(()=>{
rainSpeed = 1 + Math.random()*0.5;

if(Math.random()>0.5){
document.querySelectorAll(".plant").forEach(p=>{
p.click();
});
}
},3000);

/* 🧬 breeding system */
let breedQueue=[];

function startBreeding(){
breeding=!breeding;
breedQueue=[];
}

garden.addEventListener("click",(e)=>{
if(!breeding) return;

let plant=e.target.closest(".plant");
if(!plant) return;

breedQueue.push(plant);

if(breedQueue.length===2){
let p1=breedQueue[0];
let p2=breedQueue[1];

let mutation=Math.random()>0.5;

if(mutation){
score+=20;
}

breedQueue=[];
update();
}
});

/* 📊 update */
function update(){
document.getElementById("score").innerText=score;
document.getElementById("seeds").innerText=seeds;
}

/* start */
update();

</script>

</body>
</html>
