<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aqua Aero Hybrid Engine</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:sans-serif;
background:radial-gradient(circle,#061524,#02070d);
color:white;
}

/* 🌊 water */
#water{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle at 50% 50%,rgba(0,255,255,0.07),transparent);
animation:flow 6s infinite alternate ease-in-out;
pointer-events:none;
}

@keyframes flow{
0%{transform:scale(1)}
100%{transform:scale(1.04)}
}

/* 🪟 tank */
.tank{
position:absolute;
width:92%;
height:85%;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(255,255,255,0.06);
backdrop-filter:blur(18px);
border-radius:30px;
overflow:hidden;
border:1px solid rgba(255,255,255,0.2);
}

/* 🐠 fish */
.fish{
position:absolute;
width:50px;
height:25px;
border-radius:50px;
cursor:pointer;
background:linear-gradient(135deg,#4dd2ff,#ffffff33);
box-shadow:0 0 15px rgba(0,255,255,0.3);
}

/* 🌿 plants */
.plant{
position:absolute;
bottom:0;
width:12px;
border-radius:20px;
background:linear-gradient(to top,#00ff99,#007755);
transition:height 1s;
}

/* 🪸 rare plant glow */
.plant.rare{
background:linear-gradient(to top,#ff4df0,#ffd1ff);
box-shadow:0 0 15px rgba(255,100,255,0.4);
}

/* UI */
.ui{
position:absolute;
top:15px;
left:15px;
padding:12px;
background:rgba(255,255,255,0.12);
border-radius:14px;
backdrop-filter:blur(10px);
}

button{
margin:3px;
padding:6px 10px;
border-radius:10px;
border:none;
cursor:pointer;
background:rgba(255,255,255,0.25);
}
</style>
</head>

<body>

<div id="water"></div>

<div class="tank" id="tank"></div>

<div class="ui">
💰 Coins: <span id="coins">100</span><br>
🌿 Plants: <span id="plants">0</span><br>

<button onclick="plantSeed()">Plant Seed (1💰)</button>
<button onclick="buyFish()">Buy Fish (10💰)</button>
<button onclick="harvestAll()">Harvest</button>
<button onclick="breed()">Breed</button>
</div>

<script>

/* ======================
💰 CORE
====================== */
let coins=100;

/* ======================
🌿 PLANTS SYSTEM
====================== */
function plantSeed(){

if(coins<1) return;
coins--;

const p=document.createElement("div");
p.className="plant";

let growth=0;
let rare=Math.random()>0.85;

if(rare) p.classList.add("rare");

p.style.left=Math.random()*800+"px";
p.style.height="10px";

/* 🌱 growth cycle */
let grow=setInterval(()=>{
growth++;

p.style.height=(10+growth*6)+"px";

if(growth>=10){
clearInterval(grow);
}
},1000);

/* 💰 harvest */
p.onclick=()=>{
if(growth<5) return;

coins += rare ? 8 : 3;
p.remove();
update();
};

document.getElementById("tank").appendChild(p);
update();
}

/* ======================
🐠 FISH SYSTEM
====================== */
function buyFish(){

if(coins<10) return;
coins-=10;

const f=document.createElement("div");
f.className="fish";

let x=Math.random()*700;
let y=100+Math.random()*300;

f.style.left=x+"px";
f.style.top=y+"px";

/* 🐠 swim */
setInterval(()=>{
x += Math.sin(Date.now()*0.001)*2;
y += Math.cos(Date.now()*0.001)*1.5;

f.style.left=x+"px";
f.style.top=y+"px";
},50);

/* click info */
f.onclick=()=>{
alert("🐠 Healthy aquarium fish");
};

/* income */
setInterval(()=>{
coins+=1;
update();
},4000);

document.getElementById("tank").appendChild(f);
update();
}

/* ======================
🧬 BREEDING (needs rare plants)
====================== */
function breed(){

if(document.querySelectorAll(".plant.rare").length<1){
alert("Need a rare plant (Aero Bloom) to breed!");
return;
}

alert("🧬 New fish born!");

buyFish();
buyFish();
}

/* ======================
🌿 HARVEST ALL
====================== */
function harvestAll(){

document.querySelectorAll(".plant").forEach(p=>{
p.click();
});
}

/* ======================
📊 UPDATE
====================== */
function update(){
document.getElementById("coins").innerText=coins;
document.getElementById("plants").innerText=
document.querySelectorAll(".plant").length;
}

update();

</script>

</body>
</html>
