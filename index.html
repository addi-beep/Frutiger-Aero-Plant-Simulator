<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aqua Life Simulator</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
body { margin:0; overflow:hidden; background:#00111a; font-family:sans-serif; }

#ui {
position:absolute;
top:10px;
left:10px;
color:white;
padding:10px;
background:rgba(0,0,0,0.5);
border-radius:10px;
}
</style>
</head>

<body>
<div id="ui">🌊 Loading Aqua Life...</div>

<script>

/* ======================
🌊 WORLD SETUP
====================== */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020b14, 0.03);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,5,20);

/* ======================
💡 LIGHTS (bioluminescent vibe)
====================== */
const light = new THREE.PointLight(0x66ccff, 2, 120);
light.position.set(0,10,10);
scene.add(light);

scene.add(new THREE.AmbientLight(0x224466, 1));

/* ======================
🌊 FLOOR
====================== */
const floor = new THREE.Mesh(
new THREE.PlaneGeometry(200,200),
new THREE.MeshStandardMaterial({ color:0x062433 })
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ======================
💰 ECONOMY
====================== */
let coins = 0;

/* ======================
🧭 CONTROLS
====================== */
const keys = {};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

/* ======================
🐠 FISH WITH PERSONALITY
====================== */
const fish = [];

function createFish(){

const personalityTypes = ["shy","curious","lazy","hyper"];
const personality = personalityTypes[Math.floor(Math.random()*personalityTypes.length)];

const group = new THREE.Group();

const body = new THREE.Mesh(
new THREE.CapsuleGeometry(0.5,1.5,6,12),
new THREE.MeshStandardMaterial({
color:new THREE.Color(`hsl(${Math.random()*360},70%,60%)`)
})
);

group.add(body);

group.position.set(
(Math.random()-0.5)*70,
Math.random()*8,
(Math.random()-0.5)*70
);

group.userData = {
hunger: Math.random()*100,
personality: personality,
fed: false
};

scene.add(group);
fish.push(group);
}

for(let i=0;i<20;i++) createFish();

/* ======================
🌿 HARVESTABLE SEAWEED
====================== */
const plants = [];

function spawnPlant(){

const plant = new THREE.Mesh(
new THREE.CylinderGeometry(0.2,0.4,3),
new THREE.MeshStandardMaterial({ color:0x00aa88 })
);

plant.position.set(
(Math.random()-0.5)*100,
-2,
(Math.random()-0.5)*100
);

plant.userData = {
harvested:false,
value:1
};

scene.add(plant);
plants.push(plant);
}

for(let i=0;i<60;i++) spawnPlant();

/* ======================
🫧 CLICK INTERACTION (feed + harvest)
====================== */
window.addEventListener("click", (event)=>{

const mouse = new THREE.Vector2(
(event.clientX/window.innerWidth)*2-1,
-(event.clientY/window.innerHeight)*2+1
);

const raycaster = new THREE.Raycaster();
raycaster.setFromCamera(mouse,camera);

const hits = raycaster.intersectObjects([...fish,...plants], true);

if(hits.length > 0){

const obj = hits[0].object;

/* 🌿 HARVEST PLANT */
if(plants.includes(obj) && !obj.userData.harvested){
obj.userData.harvested = true;
scene.remove(obj);
coins += obj.userData.value;
}

/* 🐠 FEED FISH */
fish.forEach(f=>{
if(f.children.includes(obj) || f === obj){
f.userData.hunger = Math.max(0, f.userData.hunger - 40);
f.userData.fed = true;
coins += 2;
}
});

}

});

/* ======================
🌊 ANIMATION LOOP
====================== */
function animate(){

requestAnimationFrame(animate);

/* movement */
if(keys["w"]) camera.position.z -= 0.4;
if(keys["s"]) camera.position.z += 0.4;
if(keys["a"]) camera.position.x -= 0.4;
if(keys["d"]) camera.position.x += 0.4;

/* fish behavior based on personality */
fish.forEach(f=>{

f.userData.hunger += 0.02;

/* shy fish */
if(f.userData.personality === "shy"){
f.position.x += Math.sin(Date.now()*0.001)*0.02;
}

/* hyper fish */
if(f.userData.personality === "hyper"){
f.position.x += Math.sin(Date.now()*0.002)*0.1;
}

/* lazy fish */
if(f.userData.personality === "lazy"){
f.position.y += Math.sin(Date.now()*0.0005)*0.01;
}

});

/* camera drift (underwater feel) */
camera.position.y = 5 + Math.sin(Date.now()*0.0003)*0.5;

/* render */
renderer.render(scene,camera);

/* UI */
document.getElementById("ui").innerHTML =
`💰 Coins: ${coins}<br>🐠 Fish: ${fish.length}<br>🌿 Plants: ${plants.length}`;

/* resize safety */
}

animate();

window.addEventListener("resize",()=>{
camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
