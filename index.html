<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Storm Window Plant Simulator</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: sans-serif;
  background: #0f1620;
}

/* 🌧️ rain canvas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* ⚡ lightning flash */
.flash {
  position: fixed;
  width: 100%;
  height: 100%;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 1;
}

/* 🪟 window */
.window {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 80%;
  height: 70%;
  border-radius: 25px;

  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.2);
  backdrop-filter: blur(14px);
  box-shadow: 0 0 50px rgba(0,0,0,0.6);
  z-index: 2;
}

/* 🌿 sill */
.sill {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 90px;
  background: rgba(255,255,255,0.15);
}

/* 🌱 garden */
#garden {
  position: absolute;
  bottom: 90px;
  display: flex;
  gap: 12px;
  padding: 10px;
}

/* 🪴 plant */
.plant {
  width: 60px;
  height: 100px;
  position: relative;
  cursor: pointer;
}

.stem {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 4px;
  height: 100%;
  background: #2f7d4c;
  transform: translateX(-50%);
}

.leaf {
  position: absolute;
  width: 18px;
  height: 10px;
  background: #3fbf6a;
  border-radius: 50%;
}

/* 🧊 UI glass */
.ui {
  position: absolute;
  top: 20px;
  left: 20px;
  padding: 12px 18px;
  background: rgba(255,255,255,0.15);
  border-radius: 15px;
  backdrop-filter: blur(10px);
  color: white;
}

button {
  margin-top: 8px;
  padding: 6px 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: rgba(255,255,255,0.25);
}
</style>
</head>

<body>

<canvas id="rain"></canvas>
<div class="flash" id="flash"></div>

<div class="window">

  <div class="ui">
    ⭐ Score: <span id="score">0</span><br>
    <button onclick="addPlant()">New Plant</button>
    <button onclick="waterAll()">Water Plants</button>
  </div>

  <div id="garden"></div>
  <div class="sill"></div>

</div>

<script>
/* 🌧️ RAIN */
const canvas = document.getElementById("rain");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

let rain = [];
for(let i=0;i<180;i++){
  rain.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,len:15+Math.random()*15,s:4+Math.random()*4});
}

function drawRain(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="rgba(180,200,255,0.5)";
  for(let r of rain){
    ctx.beginPath();
    ctx.moveTo(r.x,r.y);
    ctx.lineTo(r.x,r.y+r.len);
    ctx.stroke();
    r.y+=r.s;
    if(r.y>canvas.height){r.y=-20;r.x=Math.random()*canvas.width;}
  }
  requestAnimationFrame(drawRain);
}
drawRain();

/* ⚡ lightning */
function lightning(){
  const f=document.getElementById("flash");
  f.style.opacity=1;
  setTimeout(()=>f.style.opacity=0,100);
}
setInterval(()=>{ if(Math.random()>0.7) lightning(); },3000);

/* 🌿 GAME */
let score=0;
let plantID=0;

function update(){
  document.getElementById("score").innerText=score;
}

function createPlant(){
  const p=document.createElement("div");
  p.className="plant";

  const stem=document.createElement("div");
  stem.className="stem";
  p.appendChild(stem);

  return p;
}

function addPlant(){
  plantID++;
  const plant=createPlant();
  let g=0;

  plant.onclick=function(){
    g++;
    score++;

    const leaf=document.createElement("div");
    leaf.className="leaf";
    leaf.style.left=(Math.random()*40-20)+"px";
    leaf.style.bottom=(g*15)+"px";
    plant.appendChild(leaf);

    if(g>=5){
      score+=5;
      plant.remove();
    }

    update();
  };

  document.getElementById("garden").appendChild(plant);
}

/* 💧 watering system */
function waterAll(){
  const plants=document.querySelectorAll(".plant");
  plants.forEach(p=>{
    score+=1;
    p.style.transform="scale(1.1)";
    setTimeout(()=>p.style.transform="scale(1)",200);
  });
  update();
}

/* 🌙 day/night cycle */
setInterval(()=>{
  const body=document.body;
  const hour=new Date().getSeconds()%20;
  if(hour<10){
    body.style.background="#0f1620";
  } else {
    body.style.background="#1e2b3a";
  }
},2000);
</script>

</body>
</html>
